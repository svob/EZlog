<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Extension Popup</title>
    <link rel="stylesheet" href="/css/popup.css">
</head>
<body>
    <div class="container">
        <section id="weekly-log">
            <h2 class="collapsible">Týdenní přehled</h2>
            <div class="content">
                <div class="week-navigation">
                    <button id="prev-week">&lt; Předchozí týden</button>
                    <span id="current-week">Týden 1</span>
                    <button id="next-week">Další týden &gt;</button>
                </div>
                <table id="weekly-tasks">
                    <thead>
                        <tr>
                            <th>Úkol</th>
                            <th>Hodiny</th>
                        </tr>
                    </thead>
                    <tbody>
                        <!-- Zde budou dynamicky vloženy řádky s úkoly -->
                    </tbody>
                    <tfoot>
                        <tr>
                            <td>Celkem</td>
                            <td id="total-hours">0</td>
                        </tr>
                    </tfoot>
                </table>
            </div>
        </section>

        <section id="favorite-tasks">
            <h2 class="collapsible">Oblíbené úkoly</h2>
            <div class="content">
                <ul id="favorite-tasks-list">
                    <!-- Zde budou dynamicky vloženy oblíbené úkoly -->
                </ul>
                <form id="log-work-form">
                    <select id="task-select" required>
                        <option value="">Vyberte úkol</option>
                    </select>
                    <input type="number" id="time-spent" placeholder="Čas (hodiny)" required>
                    <input type="text" id="work-description" placeholder="Popis práce" required>
                    <button type="submit">Zalogovat práci</button>
                </form>
            </div>
        </section>

        <section id="toggl-tasks">
            <h2 class="collapsible">Úkoly z Toggl</h2>
            <div class="content">
                <ul id="toggl-tasks-list">
                    <!-- Zde budou dynamicky vloženy úkoly z Toggl -->
                </ul>
            </div>
        </section>
    </div>
    <script src="/js/popup.js"></script>
</body>
</html>
